name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts a throwaway pgvector Postgres per test class; the runner already has Docker.
      # No GROQ_API_KEY here, so the live Groq smoke tests are skipped.
      - name: Run the test suite
        run: ./mvnw -B test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run the tests
        run: npm test
      - name: Type-check and build
        run: npm run build
